# Example buf.gen.yaml demonstrating code generation with protobuf-es, protoc-gen-go, protobuf-py, and protoc-gen-jev.
version: v2
inputs:
  - directory: examples/proto
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: examples/gen/jev
    opt:
      - paths=source_relative
  - local: protoc-gen-es
    out: examples/gen/jev
    opt:
      - target=ts
  - remote: buf.build/bufbuild/py:v0.5.0
    out: examples/gen/jev
  - local: ./protoc-gen-jev
    out: examples/gen/jev
    opt:
      # Options: go, ts, python, json, or all (comma-separated)
      - targets=all
      - paths=source_relative
