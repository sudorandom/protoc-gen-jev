syntax = "proto3";
package ai.contract.v1;
option go_package = "github.com/sudorandom/protoc-gen-jev/gen/jev/ai/contract/v1;contractv1";
import "jev/v1/options.proto";
import "ai/shared/v1/shared.proto";

message EvaluateRequest {
  string input_text = 1;
  uint64 input_count = 2;
}

message EvaluateResponse {
  optional bool flag = 1 [(jev.v1.field).noul = {threshold: 0}];
  optional int32 rating = 2 [(jev.v1.field).score = {levels: [{value: -3, description: "Low"}, {value: -2, description: "High"}]}];
  uint32 count = 3;
  int64 big_count = 4;
  uint64 big_unsigned = 5;
  fixed32 fixed_count = 6;
  sfixed64 signed_fixed_count = 7;
  bool risk = 8 [json_name = "risk-flag"];
  ai.shared.v1.Status status = 9;
  optional string label = 10 [(jev.v1.field).choice = { choices: ["YES", "NO"] }];
  int64 boundary = 14 [(jev.v1.field).score = {levels: [{value: 9007199254740990, description: "Low"}, {value: 9007199254740991, description: "High"}]}];
  oneof route {
    string email = 11;
    bytes binary = 12;
    string excluded = 13 [(jev.v1.field).skip = true];
  }
}

message Container {
  message NestedRequest { string input_text = 1; }
  message NestedResponse { optional bool accepted = 1; }
}
