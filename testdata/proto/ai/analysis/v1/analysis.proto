syntax = "proto3";

package ai.analysis.v1;

option go_package = "ai/analysis/v1;analysisv1";

import "buf/validate/validate.proto";

// Sentiment classification for the analyzed text.
enum Sentiment {
  SENTIMENT_UNSPECIFIED = 0;
  SENTIMENT_POSITIVE = 1;
  SENTIMENT_NEUTRAL = 2;
  SENTIMENT_NEGATIVE = 3;
}

// Priority level for identified action items.
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_MEDIUM = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_URGENT = 4;
}

// An entity extracted from the analyzed content.
message Entity {
  // Name or title of the extracted entity.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  
  // Category of entity (e.g. Person, Organization, Location, Technology).
  string category = 2 [(buf.validate.field).string.min_len = 1];
  
  // Relevance score from 0.0 to 1.0.
  float relevance = 3 [
    (buf.validate.field).float.gte = 0.0,
    (buf.validate.field).float.lte = 1.0
  ];
}

// A notification action demonstrating protobuf oneof.
message Notification {
  string recipient = 1 [(buf.validate.field).string.min_len = 1];

  oneof channel {
    option (buf.validate.oneof).required = true;
    string email = 2 [(buf.validate.field).string.email = true];
    string slack_channel = 3 [(buf.validate.field).string.prefix = "#"];
    string webhook_url = 4 [(buf.validate.field).string.uri = true];
  }
}

// A suggested action item derived from the text.
message ActionItem {
  // Clear actionable description of the task.
  string task = 1 [(buf.validate.field).string.min_len = 3];
  
  // Urgency and priority level of the task.
  Priority priority = 2 [(buf.validate.field).enum.defined_only = true];
  
  // Optional suggested owner or role to handle this task.
  optional string assignee = 3;

  // Optional notification channel to alert.
  Notification notification = 4;

  // Whether this task requires immediate escalation or intervention.
  bool requires_immediate_action = 5;
}

// Comprehensive analysis report generated by an AI model.
message AnalysisReport {
  // Concise title summarizing the topic.
  string title = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 100
  ];

  // High-level executive summary of the content.
  string summary = 2 [(buf.validate.field).string.min_len = 10];

  // Overall sentiment detected in the text.
  Sentiment sentiment = 3 [(buf.validate.field).enum.defined_only = true];

  // Confidence score of the overall analysis between 0.0 and 1.0.
  float confidence_score = 4 [
    (buf.validate.field).float.gte = 0.0,
    (buf.validate.field).float.lte = 1.0
  ];

  // Key takeaways and findings extracted from the text.
  repeated string key_findings = 5 [(buf.validate.field).repeated.min_items = 1];

  // Named entities mentioned in the input text.
  repeated Entity entities = 6;

  // Recommended next steps or action items.
  repeated ActionItem action_items = 7;
}
